<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgGradient)"/>
  
  <!-- Musical notes decoration -->
  <text x="50" y="80" font-size="60" fill="#ffffff" opacity="0.3">♪</text>
  <text x="700" y="200" font-size="80" fill="#ffffff" opacity="0.2">♪</text>
  
  <!-- Treble clef -->
  <text x="100" y="150" font-size="100" fill="#ffffff" opacity="0.4">𝄞</text>
  
  <!-- Main title -->
  <text x="400" y="100" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">🎵 Music Practice Scheduler 🎵</text>
  
  <!-- Subtitle -->
  <text x="400" y="180" font-size="24" fill="#ffffff" text-anchor="middle" opacity="0.9">Master Your Musical Journey</text>
  
  <!-- Decorative musical notes at bottom -->
  <text x="150" y="250" font-size="40" fill="#ffffff" opacity="0.5">♫</text>
  <text x="350" y="270" font-size="35" fill="#ffffff" opacity="0.5">♪</text>
  <text x="550" y="260" font-size="40" fill="#ffffff" opacity="0.5">♫</text>
  <text x="700" y="250" font-size="35" fill="#ffffff" opacity="0.5">♪</text>
</svg>
